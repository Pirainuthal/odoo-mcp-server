[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "odoo-mcp-server"
version = "0.1.0"
description = "A safety-first Model Context Protocol (MCP) server that lets AI assistants work with Odoo 17/18/19 over XML-RPC."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Pirainuthal S" }]
keywords = ["odoo", "mcp", "model-context-protocol", "claude", "llm", "erp", "xml-rpc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Odoo",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
odoo-mcp-server = "odoo_mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/Pirainuthal/odoo-mcp-server"
Issues = "https://github.com/Pirainuthal/odoo-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: needs a real Odoo server (set ODOO_MCP_LIVE_TEST=1 and the ODOO_* variables)"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C4", "PT", "RET"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"src/odoo_mcp_server/client.py" = ["S411"]  # xmlrpc is the transport by design; see README
"tests/*" = ["S105", "S106"]
